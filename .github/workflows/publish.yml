name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release test environment
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-build-isolation --no-deps -e ".[dev]"
          python -m pip check

      - name: Verify release
        run: |
          python scripts/check-release.py "${GITHUB_REF_NAME}"
          python -m pytest -q
          python scripts/check-stream.py

      - name: Install upload tool
        run: python -m pip install twine==6.1.0

      - name: Build package
        run: python -m build --no-isolation

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            See [CHANGELOG.md](https://github.com/ZakaCoding/ollama-workspace-agent/blob/main/CHANGELOG.md) for details.
          files: dist/*
