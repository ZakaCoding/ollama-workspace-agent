[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-workspace-agent"
version = "0.5.5"
description = "An open-source local coding assistant powered by Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ollama", "ai", "agent", "coding-assistant", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]
dependencies = [
    "python-dotenv",
    "requests",
    "httpx",
    "fastapi",
    "uvicorn",
    "rich",
]

[project.urls]
Homepage = "https://github.com/ZakaCoding/ollama-workspace-agent"
Repository = "https://github.com/ZakaCoding/ollama-workspace-agent"
Changelog = "https://github.com/ZakaCoding/ollama-workspace-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/ZakaCoding/ollama-workspace-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
owa = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
