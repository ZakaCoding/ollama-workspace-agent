[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-workspace-agent"
version = "0.2.0"
description = "An open-source local coding assistant powered by Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
    "httpx",
    "fastapi",
    "uvicorn",
    "rich",
]

[project.scripts]
owa = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
